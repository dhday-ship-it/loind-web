<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story | LOIND</title>
    <style>
      :root {
        --primary: #55689b;
        --secondary-01: #8fa8c4;
        --secondary-02: #f6fafd;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          sans-serif;
        background: #fff;
        color: #111;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      img {
        display: block;
        max-width: 100%;
      }

      /* ── Container ── */
      .container {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ── Header ── */
      .header {
        background: #fff;
        padding: 32px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .header .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .logo {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 0;
        justify-content: flex-end;
      }
      .nav a {
        padding: 4px 14px;
        font-size: 14px;
        font-weight: 500;
        color: #555;
        transition: color 0.2s;
        white-space: nowrap;
      }
      .nav a:hover,
      .nav a.active {
        color: #000;
        font-weight: 700;
      }
      .nav-separator {
        width: 1px;
        height: 12px;
        background: #e0e0e0;
        margin: 0 2px;
      }

      /* ── Featured Section ── */
      .featured-section {
        padding: 52px 0 36px;
      }
      .featured-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 40px;
        align-items: center;
      }
      .featured-img-box {
        width: 100%;
        aspect-ratio: 16/10;
        border-radius: 14px;
        overflow: hidden;
        background: #f4f4f6;
      }
      .featured-img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .featured-txt-box {
        min-width: 0;
      }
      .featured-date {
        font-size: 12px;
        color: #999;
        margin-bottom: 12px;
      }
      .featured-title {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.35;
        color: #111;
        margin-bottom: 16px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .featured-desc {
        font-size: 14px;
        color: #555;
        line-height: 1.7;
        margin-bottom: 20px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .view-featured-detail {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
        display: inline-block;
      }
      .view-featured-detail:hover {
        opacity: 0.7;
      }

      /* ── Filter Tabs ── */
      .filter-section {
        border-top: 1px solid #f0f0f0;
        padding-top: 36px;
        margin-bottom: 28px;
      }
      #sub {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
      }
      #sub li {
        font-size: 15px;
        font-weight: 500;
        color: #aaa;
        cursor: pointer;
        transition: color 0.2s;
        white-space: nowrap;
      }
      #sub li.on {
        color: var(--primary);
        font-weight: 800;
      }

      /* ── Main Layout ── */
      .layout-grid {
        display: grid;
        grid-template-columns: 1.8fr 1fr;
        gap: 60px;
        padding-bottom: 100px;
      }

      /* ── Story List ── */
      #storyBoard {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      #storyBoard li {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 28px 0;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        width: 100%;
        min-width: 0;
      }
      #storyBoard li:first-child {
        padding-top: 0;
      }

      .list-txt {
        flex: 1 1 0;
        min-width: 0;
      }
      .list-date {
        font-size: 12px;
        color: #999;
        margin-bottom: 8px;
      }
      .list-txt h4 {
        font-size: 16px;
        font-weight: 800;
        color: #111;
        line-height: 1.5;
        word-break: keep-all;
        overflow-wrap: break-word;
        transition: color 0.2s;
      }
      #storyBoard li:hover .list-txt h4 {
        color: var(--primary);
      }

      .list-img {
        flex: 0 0 140px;
        width: 140px;
        aspect-ratio: 16/10;
        border-radius: 10px;
        overflow: hidden;
        background: #f4f4f6;
      }
      .list-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .empty {
        text-align: center;
        padding: 60px 0;
        color: #aaa;
        font-size: 14px;
      }

      /* ── Sidebar ── */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .side-title {
        font-size: 13px;
        font-weight: 800;
        color: #111;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .recommend-list li {
        font-size: 13px;
        font-weight: 700;
        color: #333;
        padding: 12px 0;
        border-bottom: 1px solid #f5f5f5;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color 0.2s;
      }
      .recommend-list li:hover {
        color: var(--primary);
      }

      /* ── Modal ── */
      .modal_overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 11, 11, 0.6);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }
      .modal_overlay.active {
        display: flex;
      }
      .modal_content {
        background: #fff;
        width: 100%;
        max-width: 620px;
        max-height: 85vh;
        border-radius: 16px;
        padding: 36px;
        overflow-y: auto;
        transform: translateY(24px);
        transition: transform 0.3s ease;
      }
      .modal_overlay.active .modal_content {
        transform: translateY(0);
      }

      .modal_body img {
        width: 100%;
        max-height: 340px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 24px;
      }
      .modal_body h2 {
        font-size: 22px;
        font-weight: 800;
        color: #111;
        line-height: 1.35;
        margin-bottom: 8px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .modal_body p {
        font-size: 14px;
        color: #333;
        line-height: 1.7;
        word-break: keep-all;
      }

      .modal-img-link {
        display: block;
      }
      .modal-img-link img {
        width: 100%;
        max-height: 340px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 24px;
        transition: opacity 0.2s;
      }
      .modal-img-link:hover img {
        opacity: 0.85;
      }

      .modal-view-btns {
        display: flex;
        gap: 10px;
        margin: 20px 0 0;
      }
      .modal-view-btn {
        flex: 1;
        padding: 11px 0;
        border: 1.5px solid #e0e0e0;
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        cursor: pointer;
        transition: all 0.2s;
      }
      .modal-view-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .modal-view-btn:not(.active):hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .modal-section {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #f0f0f0;
      }
      .modal-section.visible {
        display: block;
      }

      .modal-link-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        border: 1.5px solid var(--primary);
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.2s;
      }
      .modal-link-btn:hover {
        background: var(--primary);
        color: #fff;
      }

      /* ── Footer ── */
      .footer {
        background: #0b0b0b;
        color: #fff;
        padding: 80px 0;
      }
      .footer-container {
        display: flex;
        justify-content: space-between;
        gap: 40px;
      }
      .footer-left {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 120px;
      }
      .footer-logo {
        font-size: 28px;
        font-weight: 800;
      }
      .footer-copy {
        font-size: 13px;
        color: #666;
      }
      .footer-right {
        display: flex;
        gap: 0;
      }
      .footer-links {
        margin-left: 80px;
      }
      .footer-links h4 {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 18px;
        font-weight: 700;
      }
      .footer-links a {
        display: block;
        font-size: 13px;
        color: #666;
        margin-bottom: 12px;
        transition: color 0.2s;
      }
      .footer-links a:hover {
        color: #fff;
      }
      .footer-link-cols {
        display: flex;
        gap: 50px;
      }
      .footer-link-col {
        display: flex;
        flex-direction: column;
      }

      /* ── Responsive ── */
      @media (max-width: 960px) {
        .featured-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .layout-grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .sidebar {
          border-top: 1px solid #f0f0f0;
          padding-top: 36px;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 20px 0;
        }
        .header .container {
          flex-direction: column;
          align-items: center;
        }
        .nav a {
          padding: 4px 10px;
          font-size: 13px;
        }
        .nav-separator {
          display: none;
        }
        .featured-section {
          padding: 32px 0 20px;
        }
        .featured-title {
          font-size: 20px;
        }
        .list-img {
          flex: 0 0 130px;
          width: 130px;
        }
        .layout-grid {
          padding-bottom: 60px;
        }
        .sidebar {
          display: none;
        }
        .modal_content {
          padding: 28px 20px;
        }
        .modal_body h2 {
          font-size: 18px;
        }
        .footer-container {
          flex-direction: column;
        }
        .footer-right {
          flex-direction: column;
          gap: 0;
        }
        .footer-links {
          margin-left: 0;
          margin-top: 32px;
        }
        .footer-link-cols {
          gap: 30px;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 0 16px;
        }
        .featured-title {
          font-size: 18px;
        }
        .featured-desc {
          font-size: 13px;
        }
        #sub li {
          font-size: 13px;
        }
        #storyBoard li {
          flex-direction: column;
          gap: 12px;
        }
        .list-img {
          flex: none;
          width: 100%;
          aspect-ratio: 16/9;
        }
        .modal_overlay {
          padding: 12px;
        }
        .modal_content {
          padding: 22px 16px;
          border-radius: 12px;
          max-height: 88vh;
        }
        .modal-link-btn {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo" onclick="location.href = 'index.html'">LOIND</div>
        <nav class="nav">
          <a href="about.html">About</a>
          <a href="service.html">Service</a>
          <a href="story.html">Story</a>
          <a href="contact.html">Contact</a>
          <div class="nav-separator"></div>
          <a
            href="https://www.loindworks.com"
            target="_blank"
            rel="noopener noreferrer"
            >Works</a
          >
        </nav>
      </div>
    </header>

    <section class="featured-section">
      <div class="container">
        <div class="featured-grid" id="featuredSection"></div>
      </div>
    </section>

    <div class="container">
      <div class="filter-section">
        <ul id="sub"></ul>
      </div>
    </div>

    <div class="container">
      <div class="layout-grid">
        <ul id="storyBoard"></ul>
        <aside class="sidebar">
          <div class="side-box">
            <p class="side-title">추천 소식</p>
            <ul class="recommend-list" id="recommendList"></ul>
          </div>
        </aside>
      </div>
    </div>

    <div id="modal" class="modal_overlay">
      <div class="modal_content">
        <div class="modal_body"></div>
      </div>
    </div>

    <footer class="footer">
      <div class="container footer-container">
        <div class="footer-left">
          <h2 class="footer-logo">LOIND</h2>
          <p class="footer-copy">© 2026 LOIND. All rights reserved.</p>
        </div>
        <div class="footer-right">
          <div class="footer-links">
            <h4>Company</h4>
            <div class="footer-link-cols">
              <div class="footer-link-col">
                <a href="about.html">About</a>
                <a href="service.html">Service</a>
                <a href="story.html">Story</a>
                <a href="contact.html">Contact</a>
                <a
                  href="https://www.loindworks.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Works</a
                >
              </div>
            </div>
          </div>
          <div class="footer-links">
            <h4>Resources</h4>
            <div class="footer-link-cols">
              <div class="footer-link-col">
                <a href="story.html">Story</a>
                <a
                  href="https://www.instagram.com/loind_official/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Instagram</a
                >
                <a
                  href="https://youtube.com/@dhday-c6p?si=9aGA101aiGr8QWFV"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Youtube</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBnJ_bgRb51sUUDlatipuREsfrDcoTQy1U",
        authDomain: "loind-472cd.firebaseapp.com",
        projectId: "loind-472cd",
        storageBucket: "loind-472cd.firebasestorage.app",
        messagingSenderId: "405998534289",
        appId: "1:405998534289:web:0f861bc822e1ea5391c930",
        measurementId: "G-5B5MM51YH2",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const categories = ["Creative Agency", "Creative Studio: LODN", "Impact"];
      let storyData = {};
      let allFlatStories = [];

      const sub = document.querySelector("#sub");
      const storyBoard = document.querySelector("#storyBoard");
      const modal = document.querySelector("#modal");
      const modalBody = document.querySelector(".modal_body");
      const featuredSection = document.querySelector("#featuredSection");
      const recommendList = document.querySelector("#recommendList");

      /* ── 날짜 포맷 ── */
      function formatDate(ts) {
        if (!ts) return "";
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
      }

      /* ── 데이터 로드 ── */
      async function loadStories() {
        storyBoard.innerHTML = `<li class="empty">데이터를 불러오는 중...</li>`;
        try {
          const q = query(
            collection(db, "stories"),
            orderBy("createdAt", "desc"),
          );
          const snap = await getDocs(q);
          storyData = {};
          allFlatStories = [];
          snap.forEach((doc) => {
            const item = {
              ...doc.data(),
              id: doc.id,
              dateText: formatDate(doc.data().createdAt),
            };
            if (!storyData[item.category]) storyData[item.category] = [];
            storyData[item.category].push(item);
            allFlatStories.push(item);
          });
          renderFeatured();
          renderSub();
        } catch (e) {
          console.error(e);
          storyBoard.innerHTML = `<li class="empty">서버 연결 오류가 발생했습니다.</li>`;
        }
      }

      /* ── Featured ── */
      function renderFeatured() {
        if (!allFlatStories.length) return;
        const s = allFlatStories[0];
        featuredSection.innerHTML = `
          <div class="featured-img-box"><img src="${s.img}" alt="${s.title}"></div>
          <div class="featured-txt-box">
            <p class="featured-date">${s.dateText}</p>
            <h3 class="featured-title">${s.title}</h3>
            <p class="featured-desc">${s.text || ""}</p>
            <div class="view-featured-detail" data-id="${s.id}">스토리 보기 →</div>
          </div>
        `;
        featuredSection
          .querySelector(".view-featured-detail")
          .addEventListener("click", () => openModal(s));

        recommendList.innerHTML = "";
        allFlatStories.slice(0, 4).forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item.title;
          li.addEventListener("click", () => openModal(item));
          recommendList.appendChild(li);
        });
      }

      /* ── Filter Tabs ── */
      function renderSub() {
        sub.innerHTML = "";
        categories.forEach((cat) => {
          const li = document.createElement("li");
          li.textContent = cat;
          sub.appendChild(li);
        });
        const first = sub.querySelector("li");
        if (first) {
          first.classList.add("on");
          renderList(first.textContent);
        }
      }

      sub.addEventListener("click", (e) => {
        if (e.target.tagName !== "LI") return;
        sub.querySelectorAll("li").forEach((l) => l.classList.remove("on"));
        e.target.classList.add("on");
        renderList(e.target.textContent);
      });

      /* ── Story List ── */
      function renderList(cat) {
        storyBoard.innerHTML = "";
        const list = storyData[cat] || [];
        if (!list.length) {
          storyBoard.innerHTML = `<li class="empty">'${cat}' 카테고리에 등록된 스토리가 없습니다.</li>`;
          return;
        }
        list.forEach((item) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <div class="list-txt">
              <p class="list-date">${item.dateText}</p>
              <h4>${item.title}</h4>
            </div>
            <div class="list-img"><img src="${item.img}" alt="${item.title}" loading="lazy"></div>
          `;
          li.addEventListener("click", () => openModal(item));
          storyBoard.appendChild(li);
        });
      }

      /* ── Modal ── */
      function openModal(d) {
        const imgHtml = d.link
          ? `<a href="${d.link}" target="_blank" rel="noopener noreferrer" class="modal-img-link"><img src="${d.img}" alt="${d.title}"></a>`
          : `<img src="${d.img}" alt="${d.title}">`;

        const linkBtn = d.link
          ? `<a href="${d.link}" target="_blank" rel="noopener noreferrer" class="modal-link-btn">프로젝트 바로가기 →</a>`
          : "";

        modalBody.innerHTML = `
          ${imgHtml}
          <h2>${d.title}</h2>
          ${d.text ? `<p style="font-size:13px;color:#777;margin-top:8px;line-height:1.6;">${d.text}</p>` : ""}
          <div class="modal-view-btns">
            <button class="modal-view-btn active" data-view="brief">간략보기</button>
            <button class="modal-view-btn" data-view="detail">자세히보기</button>
          </div>
          <div class="modal-section visible" id="modal-brief">
            ${d.summary ? `<p style="color:#444;line-height:1.8;font-size:14px;">${d.summary.replace(/\n/g, "<br>")}</p>` : ""}
            ${linkBtn}
          </div>
          <div class="modal-section" id="modal-detail">
            <p style="color:#444;line-height:1.8;font-size:14px;">
              ${d.detail ? d.detail.replace(/\n/g, "<br>") : "내용이 없습니다."}
            </p>
          </div>
        `;

        modalBody.querySelectorAll(".modal-view-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            modalBody
              .querySelectorAll(".modal-view-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const v = btn.dataset.view;
            document
              .getElementById("modal-brief")
              .classList.toggle("visible", v === "brief");
            document
              .getElementById("modal-detail")
              .classList.toggle("visible", v === "detail");
          });
        });

        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      loadStories();
    </script>
  </body>
</html>
