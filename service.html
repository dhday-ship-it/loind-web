                {
                    icon: 'app', title: '앱',
                    items: [
                        { subtitle: '일상 속 연결', desc: '언제 어디서든 대희의 활동과 모임 소식에 참여할 수 있는 디지털 창구입니다.' },
                        { subtitle: '참여의 진입점', desc: '처음 대희를 접하는 사람도 쉽게 흐름에 합류할 수 있도록 돕습니다.' }
                    ]
                }
            ]
        }
    };

    function renderStandard(d) {
        const level = d.standardLevel;
        const text = d.standard || 'TBD';
        if (level === 1) {
            const verseMatch = text.match(/^(.*?)(\[.*?\])$/s);
            const quote = verseMatch ? verseMatch[1].trim() : text;
            const verse = verseMatch ? verseMatch[2] : '';
            return `
                <div style="margin-bottom:35px;display:flex;align-items:flex-start;gap:8px;">
                    <span style="display:inline-block;width:4px;min-height:16px;background:#5533ff;border-radius:2px;flex-shrink:0;margin-top:2px;"></span>
                    <div>
                        <p style="font-size:18px;font-weight:800;color:#111;letter-spacing:-0.3px;margin-bottom:8px;">LOIND PRINCIPLE</p>
                        <p style="font-size:18px;font-weight:400;color:#aaa;line-height:1.75;word-break:keep-all;">${quote} <span style="font-size:13px;font-weight:600;">${verse}</span></p>
                    </div>
                </div>
            `;
        } else if (level === 2) {
            return `
                <div style="margin-bottom:35px;display:flex;align-items:center;gap:12px;">
                    <span style="font-size:10px;font-weight:700;color:#fff;background:#111;padding:4px 10px;border-radius:4px;letter-spacing:1px;text-transform:uppercase;">LOIND PRINCIPLE</span>
                    <span style="font-size:14px;font-weight:500;color:#555;">${text}</span>
                </div>
            `;

        } else {
            return `
                <div style="margin-bottom:35px;">
                    <span style="font-size:11px;font-weight:500;color:#aaa;letter-spacing:0.5px;">LOIND PRINCIPLE &nbsp;—&nbsp; ${text}</span>
                </div>
            `;
        }
    }

    function renderServiceList(list) {
        return `
            <div class="service-list" id="svc-list">
                <div class="tab-list">
                    ${list.map(({ cat }, i) => `
                        <div class="svc-tab${i === 0 ? ' active' : ''}" onclick="switchSvcTab(${i})">${cat}</div>
                    `).join('')}
                </div>
                <div class="items-panel">
                    ${list.map(({ items }, i) => `
                        <div class="items-tags${i === 0 ? ' active' : ''}">
                            ${items.map(it => `<span class="item-tag">${it}</span>`).join('')}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function switchSvcTab(i) {
        document.querySelectorAll('.svc-tab').forEach((t,idx) => t.classList.toggle('active', idx === i));
        document.querySelectorAll('.items-tags').forEach((p,idx) => p.classList.toggle('active', idx === i));
    }

    function rippleIcon(stageIdx) {
        // stageIdx: 0=누림(점), 1=됨(점+고리1), 2=번짐(점+퍼지는 고리들)
        const gold = 'var(--dh-gold)';
        if (stageIdx === 0) {
            return `<svg class="stage-ripple" viewBox="0 0 100 100"><circle cx="50" cy="50" r="11" fill="${gold}"/></svg>`;
        }
        if (stageIdx === 1) {
            return `<svg class="stage-ripple" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="9" fill="${gold}"/>
                <circle class="ring" cx="50" cy="50" r="24" fill="none" stroke="${gold}" stroke-width="2" opacity="0.5"/>
            </svg>`;
        }
        return `<svg class="stage-ripple" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="8" fill="${gold}"/>
            <circle class="ring" cx="50" cy="50" r="20" fill="none" stroke="${gold}" stroke-width="2" opacity="0.55"/>
            <circle class="ring ring-anim" cx="50" cy="50" r="33" fill="none" stroke="${gold}" stroke-width="2" opacity="0.32"/>
            <circle class="ring ring-anim" style="animation-delay:1s" cx="50" cy="50" r="46" fill="none" stroke="${gold}" stroke-width="1.5" opacity="0.16"/>
        </svg>`;
    }

    function renderDaeheeStages(stages) {
        return `
            <div class="stage-flow">
                ${stages.map((s, i) => `
                    ${i > 0 ? `<div class="stage-arrow">→</div>` : ''}
                    <div class="stage-block">
                        ${s.image
                            ? `<div class="stage-media" style="background-image:url('${s.image}');"></div>`
                            : `<div class="stage-media stage-media-empty">${rippleIcon(i)}</div>`
                        }
                        <p class="stage-name">${s.name}</p>
                        <p class="stage-line">${s.line}</p>
                        <p class="stage-desc">${s.desc}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    const channelIcons = {
        fund: '<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 11v5c0 1.66 3.13 3 7 3s7-1.34 7-3v-5"/></svg>',
        space: '<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>',
        community: '<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><circle cx="17" cy="10.5" r="2.4"/><path d="M3.5 20c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"/><path d="M14.8 15.2c2.3.3 4.2 2.4 4.2 4.8"/></svg>',
        app: '<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.2h3"/></svg>'
    };

    function renderDaeheeServices(services) {
        return `
            <div class="daehee-programs">
                ${services.map(s => `
                    <div class="dh-program">
                        <div class="dh-program-media">
                            <span class="media-icon-lg">${channelIcons[s.icon] || ''}</span>
                            <span class="media-caption">사진 준비 중</span>
                        </div>
                        <div class="dh-program-content">
                            <div class="dh-program-heading">
                                ${channelIcons[s.icon] || ''}
                                <h4 class="dh-program-title">${s.title}</h4>
                            </div>
                            <div class="dh-program-list">
                                ${s.items.map(it => `
                                    <div>
                                        <p class="dh-item-subtitle">${it.subtitle}</p>
                                        <p class="dh-item-desc">${it.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                            ${s.callout ? `<div class="dh-callout">${s.callout}</div>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBrand(key) {
        const d = brandData[key];
        let bannerHTML = '';

        if (d.isImpact) {
            return `
                <section class="daehee-hero">
                    <div class="container">
                        <p class="daehee-eyebrow">${d.subTitle} · ${d.bannerTitle}</p>
                        ${d.standard && d.standard !== 'TBD' ? `<div style="display:flex;justify-content:center;">${renderStandard(d)}</div>` : ''}
                        <h2 class="daehee-question">${d.question} <span class="daehee-accent">:)</span></h2>
                        <p class="daehee-intro">${d.intro}</p>
                    </div>
                </section>
                <section class="daehee-stages">
                    <div class="container">
                        ${renderDaeheeStages(d.stages)}
                    </div>
                </section>
                <section class="daehee-services">
                    <div class="container">
                        <p class="daehee-eyebrow">${d.servicesEyebrow}</p>
                        <h3 class="daehee-services-title">${d.servicesTitle}</h3>
                        <p class="daehee-services-intro">${d.servicesIntro}</p>
                        ${renderDaeheeServices(d.services)}
                    </div>
                </section>
            `;
        }

        if (d.isImage) {
            return `
                <section class="middle-banner-section" style="background:#fff;padding-bottom:20px;">
                    <div class="container">
                        <h2 style="font-size:34px;letter-spacing:-0.5px;">${d.bannerTitle}</h2>
                    </div>
                </section>
                <section class="business-section">
                    <div class="container">
                        <div style="margin-bottom:56px;">
                            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                                <span style="font-size:10px;font-weight:700;color:#fff;background:#111;padding:5px 10px;border-radius:4px;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;min-width:112px;text-align:center;">LOIND PRINCIPLE</span>
                                <span style="font-size:15px;font-weight:400;color:#555;line-height:1.6;">${d.standard}</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:12px;">
                                <span style="font-size:10px;font-weight:700;color:#fff;background:#111;padding:5px 10px;border-radius:4px;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;min-width:112px;text-align:center;">Slogan</span>
                                <span style="font-size:15px;font-weight:400;color:#555;">${d.slogan}</span>
                            </div>
                        </div>
                        <h3 style="margin-top:0;margin-bottom:32px;">${d.sectionTitle}</h3>
                        ${renderServiceList(d.serviceList)}
                    </div>
                </section>
            `;
        }

        if (d.isStudio) {
            const videoHTML = `
                <div style="position:relative;left:50%;transform:translateX(-50%);width:100vw;height:600px;overflow:hidden;margin-top:20px;">
                    <video autoplay loop muted playsinline style="width:100%;height:100%;display:block;object-fit:cover;object-position:top;mix-blend-mode:multiply;">
                        <source src="LODN.S2.MP4" type="video/mp4">
                    </video>
                </div>
            `;
            return `
                <section class="middle-banner-section">
                    <div class="container">
                        <h2 style="font-size:34px;letter-spacing:-0.5px;">${d.bannerTitle}</h2>
                    </div>
                    ${videoHTML}
                </section>
                <section class="business-section">
                    <div class="container">
                        ${renderStandard(d)}
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:10px;">
                            <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:transform 0.25s ease;">
                                <div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;">
                                    <img src="LODN.S.M.png" alt="음악콘텐츠" style="width:100%;height:100%;object-fit:contain;">
                                </div>
                                <p style="font-size:14px;font-weight:700;color:#111;">음악콘텐츠</p>
                                <p style="font-size:12.5px;color:#888;line-height:1.6;">오리지널 음원과 사운드 콘텐츠를 기획하고 제작합니다.</p>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">
                                <div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;">
                                    <img src="LODN.S.V.png" alt="영상콘텐츠" style="width:100%;height:100%;object-fit:contain;">
                                </div>
                                <p style="font-size:14px;font-weight:700;color:#111;">영상 콘텐츠</p>
                                <p style="font-size:12.5px;color:#888;line-height:1.6;">몰입감 있는 영상 콘텐츠로 이야기를 전합니다.</p>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">
                                <div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;">
                                    <img src="LODN.S.IP.png" alt="IP비즈니스" style="width:100%;height:100%;object-fit:contain;">
                                </div>
                                <p style="font-size:14px;font-weight:700;color:#111;">IP 비즈니스</p>
                                <p style="font-size:12.5px;color:#888;line-height:1.6;">자체 IP를 발굴하고 다양한 채널로 확장합니다.</p>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }
    }

    const contentEl = document.getElementById('brand-content');
    const brandItems = document.querySelectorAll('.brand-item');

    function switchBrand(key, scroll = true) {
        contentEl.classList.add('fading');
        setTimeout(() => {
            contentEl.innerHTML = renderBrand(key);
            contentEl.classList.remove('fading');
            if (scroll) contentEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 220);
        brandItems.forEach(el => el.classList.toggle('active', el.dataset.brand === key));
    }

    brandItems.forEach(el => el.addEventListener('click', () => switchBrand(el.dataset.brand, true)));
    switchBrand('loer', false);
</script>
</body>
</html>
